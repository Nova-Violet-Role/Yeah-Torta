    static String adaptiveIconXml() {
        def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n')
        sb.append('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n')
        sb.append('    <background android:drawable="@color/ic_launcher_background" />\n')
        sb.append('    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n')
        sb.append('    <monochrome android:drawable="@mipmap/ic_launcher_foreground" />\n')
        sb.append('</adaptive-icon>\n').toString()
    }

    // Locate cargo: prefer the rustup shim at ~/.cargo/bin, else rely on PATH.
    static String resolveCargo() {
        def home = System.getProperty('user.home')
        def win = System.getProperty('os.name').toLowerCase().contains('win')
        def explicit = new File(win ? "${home}\\.cargo\\bin\\cargo.exe" : "${home}/.cargo/bin/cargo")
        explicit.exists() ? explicit.absolutePath : 'cargo'
    }

    void runProc(List cmd, File cwd) {
        logger.lifecycle('iconforge: ' + cmd.join(' '))
        def proc = new ProcessBuilder(cmd).directory(cwd).redirectErrorStream(true).start()
        proc.inputStream.eachLine { line -> logger.lifecycle('  [iconforge] ' + line) }
        def code = proc.waitFor()
        if (code != 0) throw new RuntimeException("torta_iconforge failed (exit ${code})")
    }

    @TaskAction void generate() {
        def root = outputDir.get().asFile
        def valuesDir = new File(root, 'values'); valuesDir.mkdirs()
        def nightDir = new File(root, 'values-night'); nightDir.mkdirs()
        new File(valuesDir, 'torta_gen_colors.xml').text   = colorsXml(COLORS_DAY)
        new File(nightDir,  'torta_gen_colors.xml').text   = colorsXml(COLORS_NIGHT)
        new File(valuesDir, 'torta_gen_dimens.xml').text   = dimensXml(DIMENS)
        new File(valuesDir, 'torta_gen_styles.xml').text   = stylesXml(APP_STYLES)
        new File(valuesDir, 'torta_gen_palettes.xml').text = stylesXml(OVERLAYS)
        def drawableDir = new File(root, 'drawable'); drawableDir.mkdirs()
        DRAWABLES.each { new File(drawableDir, it.name + '.xml').text = vectorXml(it) }
        def xmlDir = new File(root, 'xml'); xmlDir.mkdirs()
        new File(xmlDir, 'filepaths.xml').text = filePathsXml(FILE_PATHS)
        new File(xmlDir, 'network_security_config.xml').text = nscXml()

        // ---- launcher family (#75): Slint-authored icon -> build-time raster via torta_iconforge ----
        // The forge (rust/torta_iconforge) renders ui/icon.slint through Slint's SOFTWARE renderer and
        // writes mipmap-*/ic_launcher{,_foreground,_round}.png into this generated res dir. The adaptive
        // -icon xml (referencing the rastered foreground) is emitted here by the xml-authority generator.
        def repo = new File(repoRoot.get())
        def manifest = new File(repo, 'rust/torta_iconforge/Cargo.toml')
        runProc([resolveCargo(), 'run', '--quiet', '--manifest-path', manifest.absolutePath, '--',
                 'forge-launcher', '--out-dir', root.absolutePath], repo)
        def anydpi = new File(root, 'mipmap-anydpi-v26'); anydpi.mkdirs()
        def adaptive = adaptiveIconXml()
        new File(anydpi, 'ic_launcher.xml').text = adaptive
        new File(anydpi, 'ic_launcher_round.xml').text = adaptive
    }
}

// ---- #68 X5: the app manifest(s) as config-as-code. Verbatim templates in SINGLE-quoted heredocs so
//      ${applicationId} stays a literal AGP manifest placeholder (substituted at merge). @string/app_name
//      is folded onto @string/main_activity_label (same value, already a resValue) — so NO strings.xml is
//      needed. Emitted into build/generated; src/main + src/debug AndroidManifest.xml are deleted. ----
abstract class GenerateTortaManifest extends DefaultTask {
    @OutputFile abstract RegularFileProperty getMainManifest()
    @OutputFile abstract RegularFileProperty getDebugManifest()

    static final String MAIN = '''<?xml version="1.0" encoding="utf-8"?>
<!--
    SPDX-License-Identifier: AGPL-3.0-or-later OR EUPL-1.2
    Yeah! Tortä   -   Copyright (c) 2026 Saimonokuma
    A privacy-first DNSCrypt pancake, forged in Rust x UniFFI x Kotlin x Slint.
    Zero telemetry. Not a single byte phones home. That is the whole point.
    Liked your slice of Tortä? Buy the baker a coffee: https://ko-fi.com/saimonokuma
-->
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools"
    android:installLocation="internalOnly"
    android:targetSandboxVersion="1"
    tools:targetApi="o">

    <uses-feature
        android:name="android.software.leanback"
        android:required="false" />
    <uses-feature
        android:name="android.hardware.touchscreen"
        android:required="false" />

    <uses-permission
        android:name="android.permission.WRITE_EXTERNAL_STORAGE"
        android:maxSdkVersion="28" />
    <uses-permission
        android:name="android.permission.READ_EXTERNAL_STORAGE"
        android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
    <!-- Keep-alive (Pillar 13 A-bis): the OS-allowlist prompt so background DNS protection
         survives aggressive battery killing. Direct-to-GIT distribution (GitHub Universal APK) →
         this permission is safe; a locked-down app store would flag/restrict it. The in-app surface
         stays a dismissible, non-blocking card; the deep-link battery-settings fallback needs no perm. -->
    <uses-permission
        android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
        tools:ignore="BatteryLife" />
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <!-- #8 Tier-3 Expert no-root powers: DECLARED so the wireless-debug shell `pm grant` can grant them
         (pm grant fails with SecurityException for an undeclared permission). Not auto-granted at install
         (signature|privileged|development) — only the UID-2000 shell grants them on Expert opt-in. -->
    <uses-permission
        android:name="android.permission.READ_LOGS"
        tools:ignore="ProtectedPermissions" />
    <uses-permission
        android:name="android.permission.WRITE_SECURE_SETTINGS"
        tools:ignore="ProtectedPermissions" />
    <uses-permission
        android:name="android.permission.QUERY_ALL_PACKAGES"
        tools:ignore="QueryAllPackagesPermission" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission
        android:name="android.permission.NEARBY_WIFI_DEVICES"
        android:usesPermissionFlags="neverForLocation"
        tools:targetApi="31" />

    <uses-permission
        android:name="android.permission.WRITE_SETTINGS"
        tools:ignore="ProtectedPermissions" />
    <uses-permission
        android:name="android.permission.MANAGE_USERS"
        tools:ignore="ProtectedPermissions" />
    <uses-permission
        android:name="android.permission.INTERACT_ACROSS_USERS"
        tools:ignore="ProtectedPermissions" />

    <application
        android:name=".App"
        android:allowBackup="false"
        android:appCategory="productivity"
        android:banner="@drawable/banner_tv"
        android:hardwareAccelerated="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/main_activity_label"
        android:largeHeap="true"
        android:logo="@drawable/ic_launcher_foreground"
        android:networkSecurityConfig="@xml/network_security_config"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true"
        android:enableOnBackInvokedCallback="false"
        tools:targetApi="33">

        <profileable android:shell="false" />

        <service
            android:name=".tiles.DNSCryptTileService"
            android:enabled="true"
            android:exported="true"
            android:icon="@drawable/ic_dns_tile"
            android:label="DNSCrypt"
            android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
            <intent-filter>
                <action android:name="android.service.quicksettings.action.QS_TILE" />
            </intent-filter>
            <meta-data
                android:name="android.service.quicksettings.TOGGLEABLE_TILE"
                android:value="true" />
        </service>

        <service
            android:name=".utils.appexit.AppExitDetectService"
            android:enabled="true"
            android:exported="false"
            android:stopWithTask="true" />

        <service
            android:name=".update.UpdateService"
            android:enabled="true"
            android:exported="false"
            android:foregroundServiceType="dataSync" />

        <!-- THE APP ENTRY (SLINT substitution · 1A): the NativeActivity host IS the launcher — the
             framework System.loadLibrary()s `torta_ui` (meta-data below) and the android-activity
             glue inside libtorta_ui.so resolves `android_main` (torta_ui src/lib.rs), which renders
             the SLINT `TortaShell` (home_shell.slint — the 4-tab Home + the ||| Advanced burger) on
             the activity's native surface. The MAIN/LAUNCHER intent-filter moved HERE from the
             old-era main activity: the icon opens the SLINT app.
             1C (the lifecycle law): launchMode=singleTask pins ONE SLINT surface instance ever —
             each NativeActivity instance spawns its OWN android_main rail thread (android-activity
             glue.rs:908), so a re-launch intent must SURFACE the live rail, never stack a second
             event loop on top of it. -->
        <activity
            android:name=".slint.TortaSlintActivity"
            android:exported="true"
            android:label="@string/main_activity_label"
            android:launchMode="singleTask"
            android:configChanges="orientation|screenSize|keyboardHidden"
            android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
            <meta-data
                android:name="android.app.lib_name"
                android:value="torta_ui" />
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />

                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
            <!-- #60G ROLE_BROWSER eligibility: a default-browser candidate MUST expose a
                 BROWSABLE http/https VIEW filter (the RoleManager browser predicate).
                 Tapped links surface the live SLINT rail (singleTask) — Carbon owns the
                 render; the URL hand-off into the pillar rides the 60H wave. -->
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />

                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />

                <data android:scheme="http" />
                <data android:scheme="https" />
            </intent-filter>
        </activity>

        <!-- #8A "Bring me a slice of tortä" trampoline: back to Tortä + the 10s "YEAH!!" toast. -->
        <activity
            android:name=".dns_engine.wire_cake_inu.TortaSliceActivity"
            android:exported="false"
            android:excludeFromRecents="true"
            android:noHistory="true"
            android:theme="@android:style/Theme.Translucent.NoTitleBar" />

        <!-- #7 Shizuku-style always-on pairing notification (in-shade pairing-code entry). -->
        <service
            android:name=".dns_engine.wire_cake_inu.WireCakeInuService"
            android:enabled="true"
            android:exported="false"
            android:foregroundServiceType="specialUse">
            <property
                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                android:value="adb_pairing" />
        </service>

        <service
            android:name=".utils.root.RootExecService"
            android:enabled="true"
            android:exported="false"
            android:foregroundServiceType="shortService" />

        <service
            android:name=".modules.ModulesService"
            android:enabled="true"
            android:exported="false"
            android:foregroundServiceType="specialUse">
            <property
                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                android:value="proxy" />
        </service>

        <!-- The old-era main activity shell is RETIRED (phase-3 strip): the SLINT
             TortaSlintActivity above owns MAIN/LAUNCHER. Its former deep-link (torta.yeah/app/*)
             and QS_TILE_PREFERENCES routes are dropped with the shell and will be re-homed onto
             the SLINT surface in a later wave. -->

        <receiver
            android:name=".BootCompleteReceiver"
            android:enabled="true"
            android:exported="true">
            <intent-filter android:priority="998">
                <action android:name="android.intent.action.BOOT_COMPLETED" />
                <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                <action android:name="android.intent.action.REBOOT" />
            </intent-filter>
            <intent-filter>
                <action android:name="pillar.kuma_saimono.libumdnscrypt.ALWAYS_ON_VPN" />
            </intent-filter>
            <intent-filter>
                <action android:name="pillar.kuma_saimono.libumdnscrypt.SHELL_SCRIPT_CONTROL" />
            </intent-filter>
        </receiver>

        <receiver
            android:name=".modules.ModulesServiceNotificationManager"
            android:exported="false" />

        <!-- The backup UI (BackupActivity) and the settings host (TortaeSettingsHost) are RETIRED
             (phase-3 strip): the SLINT surface owns settings/backup now. -->

        <service
            android:name=".vpn.service.ServiceVPN"
            android:exported="true"
            android:foregroundServiceType="specialUse"
            android:label="@string/main_activity_label"
            android:permission="android.permission.BIND_VPN_SERVICE">
            <property
                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                android:value="vpn" />
            <intent-filter>
                <action android:name="android.net.VpnService" />
            </intent-filter>
        </service>

        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">
            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/filepaths" />
        </provider>
    </application>

</manifest>
'''

    static final String DEBUG = '''<?xml version="1.0" encoding="utf-8"?>
<!--
    SPDX-License-Identifier: AGPL-3.0-or-later OR EUPL-1.2
    Yeah! Tortä — debug-build manifest overlay (debug-only hardening; base manifest generated alongside).
-->

<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools">

    <!-- Debug-only: sync memory-tagging (ARM MTE) for on-device memory-safety checks. -->
    <application android:memtagMode="sync" tools:replace="android:memtagMode"
        tools:targetApi="s">

        <!--
          Debug-only ARMING RECEIVER. The automated harness cannot arm the engine any other way,
          and both alternatives were MEASURED dead, not assumed:
            - the UI is SLINT rendered into a single surface, so there is no accessibility node
              tree; `uiautomator dump` finds nothing tappable and `input tap` can only be aimed by
              pixels guessed off a screenshot (the guess opened the PILLARS drawer instead);
            - ModulesService's own ACTION_START_ENGINE is not exported, so `am
              start-foreground-service` fails with "Requires permission not exported from uid".
          Without this, every routing measurement is vacuous: three separate readings this session
          (net_error -100 = 0, tun_count = 0, verdict delta = 0) were ZERO only because the engine
          was never armed, and each had to be withdrawn.

          It lives in the DEBUG overlay ONLY, so the release manifest gains no exported surface.
          It is also permission-guarded: a signature-level permission means only a package signed
          with the same key can send the intent, so an arbitrary app on the device cannot toggle
          the tunnel even on a debug build.
        -->
        <receiver
            android:name="pillar.kuma_saimono.libumdnscrypt.debug.HarnessArmReceiver"
            android:exported="true"
            android:permission="pillar.kuma_saimono.libumdnscrypt.permission.HARNESS">
            <intent-filter>
                <action android:name="pillar.kuma_saimono.libumdnscrypt.harness.ARM" />
                <action android:name="pillar.kuma_saimono.libumdnscrypt.harness.DISARM" />
            </intent-filter>
        </receiver>
    </application>

    <!-- Signature-level: only a build signed with the same key may arm the engine. -->
    <permission
        android:name="pillar.kuma_saimono.libumdnscrypt.permission.HARNESS"
        android:protectionLevel="signature" />
    <uses-permission android:name="pillar.kuma_saimono.libumdnscrypt.permission.HARNESS" />
</manifest>
'''

    @TaskAction void generate() {
        def m = mainManifest.get().asFile;  m.parentFile.mkdirs();  m.write(MAIN, 'UTF-8')
        def d = debugManifest.get().asFile; d.parentFile.mkdirs(); d.write(DEBUG, 'UTF-8')
    }
}

// ---- register one generator task per variant; AGP wires it into resource merge ----
androidComponents {
    onVariants(selector().all()) { variant ->
        def cap = variant.name.substring(0,1).toUpperCase() + variant.name.substring(1)
        def gen = tasks.register("generate${cap}TortaValuesRes", GenerateTortaValuesRes) { t ->
            t.repoRoot.set(project.rootDir.absolutePath)
        }
        variant.sources.res.addGeneratedSourceDirectory(gen, { it.getOutputDir() })
    }
}

// ---- #68 X5: the manifests as config-as-code (main + debug). Both source manifests are DELETED;
//      this task emits them into build/generated, the sourceSets point here, and every process*Manifest
//      task waits on generation. (Written UTF-8 so the ä in the header comment matches the xml decl.) ----
def tortaMainManifest  = layout.buildDirectory.file('generated/torta_manifest/main/AndroidManifest.xml')
def tortaDebugManifest = layout.buildDirectory.file('generated/torta_manifest/debug/AndroidManifest.xml')
def generateTortaManifest = tasks.register('generateTortaManifest', GenerateTortaManifest) { t ->
    t.mainManifest.set(tortaMainManifest)
    t.debugManifest.set(tortaDebugManifest)
}
android.sourceSets.main.manifest.srcFile(tortaMainManifest.get().asFile)
android.sourceSets.debug.manifest.srcFile(tortaDebugManifest.get().asFile)
tasks.matching { it.name.startsWith('process') && it.name.contains('Manifest') }.configureEach {
    dependsOn(generateTortaManifest)
}
