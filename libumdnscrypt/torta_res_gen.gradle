    // ---- emitters ----
    static String colorsXml(List defs) {
        def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
        defs.each { sb.append('    <color name="').append(it[0]).append('">').append(it[1]).append('</color>\n') }
        sb.append('</resources>\n').toString()
    }
    static String dimensXml(List defs) {
        def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
        defs.each { sb.append('    <dimen name="').append(it[0]).append('">').append(it[1]).append('</dimen>\n') }
        sb.append('</resources>\n').toString()
    }
    static String stylesXml(List styles) {
        def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
        styles.each { s ->
            sb.append('    <style name="').append(s.name).append('"')
            if (s.parent != null) sb.append(' parent="').append(s.parent).append('"')
            if (s.items.isEmpty()) { sb.append(' />\n') }
            else {
                sb.append('>\n')
                s.items.each { it2 -> sb.append('        <item name="').append(it2[0]).append('">').append(it2[1]).append('</item>\n') }
                sb.append('    </style>\n')
            }
        }
        sb.append('</resources>\n').toString()
    }

    static String pathTag(Map a, String indent) {
        def sb = new StringBuilder(indent).append('<path')
        ['pathData','fillColor','strokeColor','strokeWidth','strokeLineCap'].each { k ->
            if (a[k] != null) sb.append(' android:').append(k).append('="').append(a[k]).append('"')
        }
        sb.append(' />\n').toString()
    }
    static String vectorXml(Map d) {
        def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n')
        sb.append('<vector xmlns:android="http://schemas.android.com/apk/res/android"\n')
        sb.append('    android:width="').append(d.w).append('"\n')
        sb.append('    android:height="').append(d.h).append('"\n')
        sb.append('    android:viewportWidth="').append(d.vw).append('"\n')
        sb.append('    android:viewportHeight="').append(d.vh).append('"')
        if (d.tint != null) sb.append('\n    android:tint="').append(d.tint).append('"')
        sb.append('>\n')
        d.nodes.each { n ->
            if (n.group != null) {
                sb.append('    <group')
                ['translateX','translateY','scaleX','scaleY'].each { k -> if (n.group[k] != null) sb.append(' android:').append(k).append('="').append(n.group[k]).append('"') }
                sb.append('>\n')
                n.paths.each { p -> sb.append(pathTag(p, '        ')) }
                sb.append('    </group>\n')
            } else {
                sb.append(pathTag(n.path, '    '))
            }
        }
        sb.append('</vector>\n').toString()
    }
    static String filePathsXml(List defs) {
        def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<paths>\n')
        defs.each { sb.append('    <').append(it[0]).append(' name="').append(it[1]).append('" path="').append(it[2]).append('" />\n') }
        sb.append('</paths>\n').toString()
    }
    static String nscXml() {
        def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n')
        sb.append('    <base-config cleartextTrafficPermitted="').append(NSC_BASE_CLEARTEXT).append('">\n')
        sb.append('        <trust-anchors>\n')
        NSC_TRUST_ANCHORS.each { sb.append('            <certificates src="').append(it).append('" />\n') }
        sb.append('        </trust-anchors>\n    </base-config>\n')
        NSC_DOMAIN_CONFIGS.each { dc ->
            sb.append('    <domain-config cleartextTrafficPermitted="').append(dc.cleartext).append('">\n')
            dc.domains.each { dom -> sb.append('        <domain includeSubdomains="').append(dc.includeSubdomains).append('">').append(dom).append('</domain>\n') }
            sb.append('    </domain-config>\n')
        }
        sb.append('</network-security-config>\n').toString()
    }

    // ---- launcher (#75): the generator stays the XML authority; it emits the adaptive-icon xml that
