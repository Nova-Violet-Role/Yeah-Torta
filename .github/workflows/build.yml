##
##  Yeah! Tortä — the whole product, built from source, by GitHub.
##
##  THE POINT OF THIS FILE: nothing binary is committed any more. The engine `.so`, the Slint UI
##  `.so`, and the UniFFI Kotlin bindings are BUILD OUTPUT and are produced here, on a clean
##  runner, from source alone. If this workflow is green, the repository genuinely contains
##  everything needed to make the app — which a repository that ships prebuilt artifacts can never
##  prove about itself.
##
##  Every job below is a gate that CAN FAIL, and each one was chosen because the corresponding
##  failure has actually happened on this project:
##
##    rust-tests      the engine suite under the SHIP recipe, plus a floor gate so it cannot
##                    silently shrink. A regression in the engine must never reach an APK.
##    rust-abi-warnings  zero compiler warnings on the four ABIs that go into the APK.
##    bindings-drift  the committed torta_core.kt must equal what the CURRENT Rust surface
##                    generates. Hand-edited or stale bindings compile fine and then fail at
##                    runtime with an ABI mismatch, which is the worst place to find out.
##    android         builds arm64-v8a + x86_64 and CHECKS THE SYMBOLS ARE IN THE .so. A build
##                    without `--features mirror` succeeds, produces a .so with ZERO
##                    `mirror_status` symbols, and silently disables Centauri. That near-miss is
##                    why the symbol assertion exists.
##
##  Release artefacts are marked PRE-RELEASE, because that is what an alpha is.
##

name: build

on:
  push:
    branches: [main, torta]
    tags: ['v*']
  pull_request:
    branches: [main, torta]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A cross-compile that fails late costs ten minutes; failing fast costs seconds.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:

  # ---------------------------------------------------------------------------------------------
  # 1. THE ENGINE'S OWN TESTS — before anything is packaged.
  # ---------------------------------------------------------------------------------------------
  rust-tests:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/torta_core

      # THE SHIP RECIPE, not a subset of it (Cargo.toml:236-238: mirror,pure_rust,netstack).
      #
      # This step used to run `--features mirror` alone, with a comment correctly explaining that
      # dropping `mirror` would test a smaller suite than the product. The same argument had not
      # been carried to the other two features, and it applies with more force: without `netstack`
      # the FORWARDER DATAPATH THAT SHIPS IS NOT COMPILED, so no test could reach it and a green
      # run said nothing about it. MEASURED 2026-08-01 on aarch64-linux-android --all-targets:
      # `--features mirror` = 35 warnings, `mirror,pure_rust,netstack` = 9. Twenty-six of CI's
      # warnings were reporting on code that is only unreachable in the configuration CI invented.
      #
      # A CI feature set that is a SUBSET of the ship recipe is not a cheaper test, it is a test of
      # a different program.
      # The Rust test `the_shipped_config_round_trips_through_the_live_model` parses
      # `shipped/dnscrypt-proxy.toml` and its doc calls it "the exact bytes shipped inside
      # assets/dnscrypt.zip". Nothing enforced that. Measured 2026-08-01: the checker the source
      # comment named (tools/check-shipped-toml.sh) DID NOT EXIST, and the two had already drifted
      # by three lines -- the tordnscrypt -> libumdnscrypt rename applied to the text copy and
      # missed inside the binary zip. The test was green while testing a file no device receives.
      #
      # Runs BEFORE cargo test: if the corpus is not the shipped bytes, the round-trip result is
      # meaningless and there is no point spending ten minutes proving it.
      - name: the Rust corpus must BE the shipped asset
        run: node tools/shipped/check-shipped-toml.js

      - name: cargo test --features mirror,pure_rust,netstack (the ship recipe)
        working-directory: rust/torta_core
        run: cargo test --lib --features mirror,pure_rust,netstack | tee "$RUNNER_TEMP/test.out"
        # NOTE: `tee` is safe here ONLY because `pipefail` is set by GitHub's default bash flags
        # (`bash -e -o pipefail`), so the pipeline still reports cargo's failure. The count gate
        # below re-reads the file rather than the pipe.

      # A FLOOR, NOT AN EXACT COUNT -- and that distinction is the whole point.
      #
      # This job was named "engine tests (1311)" while the suite had grown to 1375. A number frozen
      # into a label is wrong the day someone adds a test, and the obvious repair (edit the label)
      # teaches nobody anything. Worse, had it been an EQUALITY gate it would have failed every
      # correct commit that added coverage -- a spec that forbids a correct future.
      #
      # A floor is durable: it can only be broken by tests DISAPPEARING, which is the failure that
      # actually matters and is otherwise invisible -- a deleted #[test] or a module dropped from a
      # cfg leaves the run green with a smaller suite. Raise the floor deliberately when the suite
      # grows; never lower it to make a red build green.
      - name: the suite must not silently shrink
        working-directory: rust/torta_core
        run: |
          FLOOR=1370
          # Sum every "test result: ok. N passed" line -- the lib target may report more than once.
          PASSED=$(grep -oE '^test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test.out" \
                   | grep -oE '[0-9]+' | paste -sd+ - | bc)
          echo "passed=$PASSED floor=$FLOOR"
          if [ -z "$PASSED" ]; then
            echo "::error::could not parse a test count -- the gate cannot pass by failing to measure"
            exit 1
          fi
          if [ "$PASSED" -lt "$FLOOR" ]; then
            echo "::error::the suite SHRANK: $PASSED passed, floor is $FLOOR. Tests were removed or stopped compiling in."
            exit 1
          fi

      # PROMOTED FROM ADVISORY TO A GATE (2026-08-01), because advisory meant invisible.
      #
      # This step used to be `continue-on-error: true` with `cargo fmt --check || echo
      # "::warning::rustfmt differences present"`. The crate carried 572 formatting hunks across 66
      # files and that warning fired on EVERY run -- and I never saw it, because my own run-log
      # sweep counted `warning:` and `w: file` and `##[error]` but not `##[warning]`, which is the
      # only channel a `::warning::` annotation appears on. Three green runs were reported as
      # "0 warnings" while this one sat in the log untouched.
      #
      # `cargo fmt` has now been applied (semantics-preserving; 1375 tests still pass, clippy on the
      # ship ABI still 0 under -D warnings), so the gate starts from a clean tree.
      #
      # An EQUALITY gate is right here, unlike the deprecation ceiling: "formatted" is binary and
      # every correctly-formatted future passes it. It forbids no correct change.
      #
      # clippy stays out of this step -- it is hard-gated per shipped ABI in rust-abi-warnings,
      # where the TARGET is right. Running it here on the host would re-report host-only findings.
      - name: rustfmt must stay clean
        working-directory: rust/torta_core
        run: |
          set +e
          out="$(cargo fmt --check 2>&1)"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "$out" | head -60
            hunks=$(echo "$out" | grep -c '^Diff in' || true)
            echo "::error::rustfmt differences present ($hunks hunk(s)). Run 'cargo fmt' in rust/torta_core."
            exit 1
          fi
          echo "rustfmt clean"

  # ---------------------------------------------------------------------------------------------
  # 1b. ZERO WARNINGS ON THE ABIs THAT SHIP — a separate job because it needs the NDK.
  #
  # WHY ITS OWN JOB, learned by getting it wrong first: this began as a step inside `rust-tests`,
  # which has no NDK. `ring`'s build script cross-compiles C, so every target died with
  # `cc-rs: failed to find tool "x86_64-linux-android-clang"` -- and the step then reported
  # "emits warnings under the ship recipe". THAT MESSAGE WAS FALSE. A missing toolchain is not a
  # warning, and an alarm that attributes every non-zero exit to its own subject sends you hunting
  # for dead code that was never there. The gate below therefore SEPARATES the two outcomes and
  # says which one happened.
  #
  # WHY THE TARGET MATTERS: on a Windows dev box the identical library reports 135 warnings,
  # because every #[cfg(unix)] caller compiles out and the callee left behind looks dead. On
  # aarch64-linux-android it reports 0. Warnings are a property of the TARGET, so the only honest
  # place to ask is the four ABIs that actually go into the APK.
  # ---------------------------------------------------------------------------------------------
  rust-abi-warnings:
    name: zero warnings on the 4 shipped ABIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/torta_core

      - uses: android-actions/setup-android@v4
      - name: NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264" >/dev/null
          # BOTH variables, deliberately. The runner image ships ANDROID_NDK_ROOT pointing at its own
          # NDK (27.3.13750724 at the time of writing), so setting only ANDROID_NDK_HOME left the two
          # disagreeing and cargo-ndk said so, 12 times per green run:
          #   warning: Environment variable `ANDROID_NDK_HOME = .../26.3.11579264` doesn't match
          #            `ANDROID_NDK_ROOT = .../27.3.13750724`
          # That is not cosmetic. It means WHICH NDK compiles the shipped .so was ambiguous, decided
          # by a precedence rule rather than by this file. Pointing both at the version we install
          # makes the answer explicit and does not change which toolchain is used -- cargo-ndk was
          # already preferring HOME, which is why it warned about ROOT rather than the reverse.
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: check every shipped ABI with -D warnings
        working-directory: rust/torta_core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
                            i686-linux-android x86_64-linux-android
          fail=0
          # cargo-ndk sets CC/AR/linker for the NDK, which is what `ring` needs. `-t` takes the
          # Android ABI name; the rust triples above are what those map to.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "::group::$abi"
            # Output is captured so the two failure modes can be told apart. cargo's exit code is
            # read directly from $? on the very next line -- never through a pipe.
            # `set +e` around the capture, and it is NOT belt-and-braces. GitHub runs steps under
            # `bash -e`, and the exit status of `var=$(cmd)` is cmd's status -- so errexit killed
            # the step RIGHT HERE, before any of the classification below could run. Every branch
            # that tells "emits warnings" from "failed to build" was unreachable on the only path
            # that needs it. Measured on run 30694805814: the step died with `exit code 101` having
            # printed nothing but the group header, which is exactly the uninformative failure this
            # gate was written to avoid.
            set +e
            out="$(RUSTFLAGS='-D warnings' cargo ndk -t "$abi" check \
                     --features mirror,pure_rust,netstack --all-targets 2>&1)"; code=$?
            set -e
            echo "$out"
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "  $abi: clean"
            elif echo "$out" | grep -qE "^(warning|error): .* (is never|are never|should have|unused)"; then
              echo "::error::$abi emits WARNINGS under the ship recipe (denied by -D warnings)"
              fail=1
            else
              echo "::error::$abi FAILED TO BUILD -- this is not a warning regression, read the log"
              fail=1
            fi
          done
          exit $fail

      # -----------------------------------------------------------------------------------------
      # CLIPPY, GATED -- on the ABIs that ship, not on the host.
      #
      # WHY THIS STEP EXISTS. The advisory `cargo clippy` in rust-tests is `continue-on-error: true`,
      # so the job reported SUCCESS while its log carried 30 clippy warnings. That is not a lie by
      # the workflow -- advisory means advisory -- but it means the only way to see them was to
      # DOWNLOAD THE RUN LOG ZIP, which is how they were found at all. A number nobody enforces
      # drifts back up; it was 24 on the ship target and is now 0, so it gets a gate.
      #
      # WHY HERE AND NOT IN rust-tests. Warnings are a property of the TARGET. The host figure and
      # the Android figure disagreed (30 vs 24), and it is the four shipped ABIs that matter. This
      # job already has the NDK and cargo-ndk, which `ring` needs to cross-compile; putting the gate
      # in rust-tests is exactly the mistake that made the FIRST version of this gate fail every run
      # with a cc-rs error it then misreported as a warning regression.
      #
      # The advisory step upstream is deliberately left in place: it also runs `cargo fmt --check`
      # and still covers the host, which this does not.
      - name: clippy must stay at zero on the shipped ABIs
        working-directory: rust/torta_core
        run: |
          fail=0
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "::group::clippy $abi"
            # Same errexit trap as the check gate above -- see the note there.
            set +e
            out="$(cargo ndk -t "$abi" clippy \
                     --lib --features mirror,pure_rust,netstack -- -D warnings 2>&1)"; code=$?
            set -e
            echo "$out"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              # Same discipline as the check gate above: distinguish "clippy objected" from "the
              # build broke", because conflating them sent me chasing a warning that was an NDK
              # failure for two CI runs.
              # MEASURED, not guessed: clippy does NOT put "clippy::" on the message line. It prints
              # `error: this `match` expression can be replaced with `?`` and names the lint only in
              # the trailing help URL. The first version of this test grepped for "clippy::" and so
              # reported five genuine lint findings as "FAILED TO RUN" on all four ABIs -- the exact
              # misattribution the branch exists to prevent, committed inside the fix for it.
              # The help URL is the reliable marker: every clippy lint emits one, a compile error
              # does not.
              if echo "$out" | grep -q "rust-clippy/.*index.html#"; then
                echo "::error::$abi has CLIPPY findings (denied by -D warnings)"
              else
                echo "::error::$abi clippy FAILED TO RUN -- not a lint regression, read the log"
              fi
              fail=1
            else
              echo "  $abi: clippy clean"
            fi
          done
          exit $fail

  # ---------------------------------------------------------------------------------------------
  # 2. BINDINGS DRIFT — the generated Kotlin must match the Rust surface that exists TODAY.
  # ---------------------------------------------------------------------------------------------
  bindings-drift:
    name: uniffi bindings are not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/torta_core

      # UniFFI 0.31 ships no standalone CLI, so the generator is a bin target IN THIS REPO,
      # gated behind `uniffi-cli` so clap never enters the shipped cdylib.
      #
      # MEASURED TRAP: `--library` must point at the HOST cdylib. Given a cross-compiled Android
      # .so, uniffi-bindgen exits 0 and writes NOTHING — two runs looked green and produced no
      # file. On this runner the host cdylib is target/debug/libtorta_core.so.
      - name: Generate bindings from the HOST cdylib
        working-directory: rust/torta_core
        run: |
          # ★ ONE CONSISTENT FEATURE SET FOR BOTH COMMANDS (2026-08-01).
          # These two steps used `--features mirror` then `--features uniffi-cli`. Cargo features
          # are per-invocation, so the second command RE-LINKS the cdylib with only `uniffi-cli`
          # and bindgen can end up reading a library with no `mirror` in it. Measured locally when
          # regenerating: that produced bindings missing EVERY Centauri export -- a 4,952-line diff
          # consisting entirely of deletions, which this gate would then report as "your committed
          # bindings are stale" while the truth was that the generator had been handed the wrong
          # library.
          # Both commands now carry the same set, so the artifact bindgen reads is the one the
          # previous line built.
          #
          # ★ AND THAT SET IS NOW THE SHIP RECIPE + cli (2026-08-01), not `mirror` alone.
          #
          # MEASURED BEFORE CHANGING IT, because the honest answer mattered: bindings generated from
          # `mirror,uniffi-cli` and from `mirror,pure_rust,netstack,uniffi-cli` are byte-identical
          # today -- diff exit 0, 0 lines, 27136 lines each. So this fixes NO current drift, and
          # claiming otherwise would be inventing a bug to justify a change.
          #
          # It is still wrong to leave, because that identity is a CONTINGENT fact, not a property.
          # The day someone adds a #[uniffi::export] behind #[cfg(feature = "netstack")] -- which is
          # exactly how the netstack capability surface was added -- this gate would generate the
          # bindings WITHOUT it and then fail the correct commit for being "stale", with the obvious
          # repair being to delete the new export from the committed file. A gate that punishes the
          # right change is worse than no gate. Generating from the recipe that SHIPS makes the
          # comparison meaningful for whatever the surface becomes.
          cargo build --lib --features mirror,pure_rust,netstack,uniffi-cli
          test -f target/debug/libtorta_core.so || { echo "::error::host cdylib missing — bindgen would silently write nothing"; exit 1; }
          grep -qa centauri_serve_hits target/debug/libtorta_core.so \
            || { echo "::error::host cdylib carries no mirror exports — bindgen would emit bindings missing every Centauri function"; exit 1; }
          # NO `grep -qa torta-netstack` ASSERTION HERE, and the reason is worth more than the
          # assertion would have been. I wrote one, then ran the negative control before trusting it:
          # built the cdylib WITHOUT the netstack feature and grepped again. It still matched, twice.
          #
          # The thread name lives in `tunnel/mod.rs:1159`, inside a function gated
          # `#[cfg(all(unix, feature = "netstack"))]` -- but the SAME literal also appears in the doc
          # comments at `lib.rs:58` and `lib.rs:65`, and rustc embeds doc text in the crate metadata
          # carried by the dylib. So the string is present whether or not the code is. Measured on a
          # Windows host, where `unix` is false and the function CANNOT have been compiled: count 2.
          #
          # An assertion that matches its own documentation is decoration, and a decoration in a
          # fail-closed position is worse than nothing -- it reads as proof. The android job's
          # equivalent check on the STRIPPED release .so is a different measurement and was observed
          # to discriminate (0 before the netstack fix, 3 after); this one would not have.
          cargo run --bin uniffi-bindgen --features mirror,pure_rust,netstack,uniffi-cli -- \
            generate --library target/debug/libtorta_core.so \
            --language kotlin --out-dir "$RUNNER_TEMP/bindgen_out"
          test -s "$RUNNER_TEMP/bindgen_out/uniffi/torta_core/torta_core.kt" \
            || { echo "::error::bindgen produced no output"; exit 1; }

      - name: Diff against the committed bindings
        run: |
          COMMITTED=libumdnscrypt/src/main/kotlin/uniffi/torta_core/torta_core.kt
          GENERATED="$RUNNER_TEMP/bindgen_out/uniffi/torta_core/torta_core.kt"
          if ! diff -q "$COMMITTED" "$GENERATED" >/dev/null; then
            echo "::error::Committed UniFFI bindings are STALE. Regenerate them:"
            echo "  cd rust/torta_core && cargo run --bin uniffi-bindgen --features uniffi-cli -- \\"
            echo "    generate --library target/debug/libtorta_core.so --language kotlin \\"
            echo "    --out-dir ../../libumdnscrypt/src/main/kotlin"
            diff "$COMMITTED" "$GENERATED" | head -60
            exit 1
          fi
          echo "bindings match the current Rust surface"

  # ---------------------------------------------------------------------------------------------
  # 3. THE APKs — arm64-v8a and universal (x86_64), each with the engine built from source.
  # ---------------------------------------------------------------------------------------------
  android:
    name: apk (${{ matrix.flavor }})
    # rust-abi-warnings added 2026-08-01: an APK must not be built from an engine that only
    # compiles cleanly by not being asked. The gate is cheap and it fails closed.
    needs: [rust-tests, rust-abi-warnings, bindings-drift]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: arm64
            abi: arm64-v8a
            rust_target: aarch64-linux-android
          - flavor: universal
            abi: x86_64
            rust_target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node (the A14 uniffi-records guard is a node script)
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/torta_core
            rust/torta_ui
          key: ${{ matrix.abi }}

      # torta_iconforge (the launcher-icon / values generator that Gradle runs as
      # :generateXxxTortaValuesRes) pulls yeslogic-fontconfig-sys, whose build script links
      # against the SYSTEM fontconfig. The GitHub runner image does not ship the dev headers,
      # so the build script exits 101 and Gradle reports only "torta_iconforge failed
      # (exit 101)" -- a failure whose real cause is four log screens further up.
      #
      # This is a HOST-side dependency of a build tool, not an Android one: it renders on the
      # runner and emits resources. It is therefore installed here rather than being papered
      # over by disabling the task, which would ship an APK missing generated resources while
      # the build stayed green.
      - name: Host libraries for torta_iconforge (fontconfig)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev libfreetype6-dev pkg-config
          pkg-config --modversion fontconfig

      # ★ THE LINUX GOLDEN BASELINE. `jesdict` carries three `Text` elements with no pinned
      # font-family, so it rasterises with the HOST's default font and cannot match a golden
      # baked on Windows (measured: 2,290 differing pixels, max_delta 227; every pure-shape
      # scene matched exactly). The verifier now prefers `<scene>.<os>.png`, so this step
      # renders the Linux set and uploads it as an artifact -- which is how a real baseline
      # gets INSPECTED and committed, rather than a tolerance being invented to make the
      # comparison stop complaining.
      - name: Render Linux golden candidates (artifact, never authoritative)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd rust/torta_iconforge
          mkdir -p /tmp/goldens-linux
          # `bless` is the real emit subcommand (src/main.rs:312) and it refuses to write a BLANK
          # raster, so an empty render cannot become a baseline. Names verified in the source, not
          # guessed: an invented flag would fail silently under continue-on-error and upload nothing.
          cargo run --quiet -- bless --goldens /tmp/goldens-linux
          ls -la /tmp/goldens-linux

      - name: Upload Linux golden candidates
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: goldens-linux-${{ matrix.abi }}
          path: /tmp/goldens-linux
          if-no-files-found: warn

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264" >/dev/null
          # BOTH variables, deliberately. The runner image ships ANDROID_NDK_ROOT pointing at its own
          # NDK (27.3.13750724 at the time of writing), so setting only ANDROID_NDK_HOME left the two
          # disagreeing and cargo-ndk said so, 12 times per green run:
          #   warning: Environment variable `ANDROID_NDK_HOME = .../26.3.11579264` doesn't match
          #            `ANDROID_NDK_ROOT = .../27.3.13750724`
          # That is not cosmetic. It means WHICH NDK compiles the shipped .so was ambiguous, decided
          # by a precedence rule rather than by this file. Pointing both at the version we install
          # makes the answer explicit and does not change which toolchain is used -- cargo-ndk was
          # already preferring HOME, which is why it warned about ROOT rather than the reverse.
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      # torta_ui pulls i-slint-backend-android-activity, whose build.rs resolves
      # android.jar through android-build's env_paths chain:
      #   ANDROID_JAR -> explicit platform -> ANDROID_PLATFORM/API_LEVEL/SDK_VERSION
      #   -> lexicographic max of <sdk>/platforms/*
      # Pinning ANDROID_JAR short-circuits the whole chain deterministically. The
      # lexicographic fallback is the hazard worth avoiding: a preview directory
      # like "android-37.0" wins .max() over "android-36" and the build silently
      # compiles against a surface nobody chose.
      #
      # These used to live in rust/.cargo/config.toml as absolute D:/ paths. That
      # file is now gitignored (it broke this very job -- see the template at
      # rust/.cargo/config.toml.example), so CI states its own values here, from
      # the runner's SDK, with no machine-local anything.
      - name: Android platform for slint-android-activity
        run: |
          set -euo pipefail
          PLAT=$(ls -1 "$ANDROID_SDK_ROOT/platforms" | sort -V | tail -1)
          JAR="$ANDROID_SDK_ROOT/platforms/$PLAT/android.jar"
          test -f "$JAR" || { echo "::error::no android.jar under $PLAT"; exit 1; }
          {
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_PLATFORM=$PLAT"
            echo "ANDROID_JAR=$JAR"
          } >> "$GITHUB_ENV"
          echo "using $PLAT -> $JAR"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # ★ THE SHIP RECIPE, quoted from rust/torta_core/Cargo.toml:236-238 -- not chosen by me:
      #
      #   "the engine .so MUST build --features mirror,pure_rust,netstack -- without netstack,
      #    set_netstack is a documented no-op (tunnel/mod.rs) and the tunnel silently runs DNS-only
      #    while the Kotlin side logs 'forwarder ARMED'."
      #
      # This job previously built `--features mirror` alone. That is the SAME defect class the
      # symbol gate below was written to catch, reintroduced one line above it: the build succeeds,
      # every test passes, the UI reports the forwarder armed, and the forwarder thread
      # ("torta-netstack", tunnel/mod.rs:1159) never exists -- so non-DNS traffic never leaves
      # through the Rust datapath and pages do not load through it. Measured on the .so this repo
      # last produced: `grep -c -a torta-netstack` = 0.
      #
      # `pure_rust` and `netstack` are real features (Cargo.toml [features]); `odoh` is deliberately
      # NOT added here -- it is not part of the quoted recipe, and widening a ship recipe on a hunch
      # is how the next silent difference gets in.
      - name: Build torta_core (${{ matrix.abi }})
        working-directory: rust/torta_core
        run: |
          cargo ndk -t ${{ matrix.abi }} -o ../../libumdnscrypt/src/main/jniLibs \
            build --release --features mirror,pure_rust,netstack

      # THE UI. The entire interface is compiled Rust + Slint; slint-build rasterises the .slint
      # files during this step, so a broken scene fails HERE rather than at runtime.
      - name: Build torta_ui (${{ matrix.abi }})
        working-directory: rust/torta_ui
        run: |
          cargo ndk -t ${{ matrix.abi }} -o ../../libumdnscrypt/src/main/jniLibs \
            build --release

      # ★ THE SYMBOL GATE. A cargo build that "succeeded" is not evidence the pillar shipped.
      # This project once produced a release .so with 0 mirror_status symbols against an
      # expected 4 — a green build that would have killed Centauri's serve leg on every device.
      - name: Assert the pillar symbols are actually in the .so
        run: |
          SO=libumdnscrypt/src/main/jniLibs/${{ matrix.abi }}/libtorta_core.so
          UI=libumdnscrypt/src/main/jniLibs/${{ matrix.abi }}/libtorta_ui.so
          test -f "$SO" || { echo "::error::$SO was not produced"; exit 1; }
          test -f "$UI" || { echo "::error::$UI was not produced"; exit 1; }
          # `torta-netstack` is the FORWARDER THREAD NAME (tunnel/mod.rs:1159) and it is the check
          # Cargo.toml:238 itself prescribes: "Verify a candidate .so with:
          # grep -c -a 'torta-netstack' <so> -> >=1". It is in this list because its absence is
          # INVISIBLE at runtime -- the Kotlin side still logs "forwarder ARMED" while the thread
          # that would carry the traffic was never compiled in. A pillar that fails loudly needs no
          # gate; this one needed exactly this.
          for sym in mirror_status centauri_serve_hits resolver_doh_sinkhole_on torta-netstack; do
            n=$(grep -ac "$sym" "$SO" || true)
            echo "  $sym: $n"
            [ "$n" -gt 0 ] || { echo "::error::$sym MISSING from $SO — built without the full ship recipe (mirror,pure_rust,netstack)?"; exit 1; }
          done
          ls -la libumdnscrypt/src/main/jniLibs/${{ matrix.abi }}/

      - name: Gradle assemble ${{ matrix.flavor }}Debug
        run: ./gradlew :libumdnscrypt:assemble${{ matrix.flavor == 'arm64' && 'Arm64' || 'Universal' }}Debug --stacktrace

      - name: JVM unit tests
        run: ./gradlew :libumdnscrypt:test${{ matrix.flavor == 'arm64' && 'Arm64' || 'Universal' }}DebugUnitTest --stacktrace

      # The suppressed-deprecation backlog must not silently grow back.
      #
      # Kotlin's deprecation warnings in this module are hidden behind narrowly-scoped
      # @Suppress("DEPRECATION") annotations, each one a deliberate, documented legacy branch. That
      # is the right call for minSdk 21 -- but it also means a NEW deprecated usage can be added
      # under a suppression and nobody sees it. This step strips every suppression, recompiles, and
      # asserts the count of UNGATED usages (ones NOT behind a Build.VERSION.SDK_INT branch) has not
      # risen above the committed baseline.
      #
      # It is a CEILING, not an equality: fixing a deprecation PASSES and prints the slack to
      # reclaim. Pinning the exact number would turn the build red on a correct commit and invite
      # someone to weaken the gate, which would destroy the coverage it exists to provide.
      #
      # Runs only on arm64 so the two APK jobs do not duplicate a ~2 minute recompile, and runs
      # AFTER assemble + unit tests so a stripped tree can never reach the shipped artifact.
      # The parser is the front door of every deprecation number. DeprecationKeying.lean proves
      # the ceiling COMPARISON is sound and line-move invariant; nothing proved the EXTRACTION,
      # and a mis-parse would satisfy every theorem while measuring nothing. This runs the real
      # parser over a corpus of verbatim compiler output plus the adversarial branches the live
      # log does not reach (no-quote fallback, non-ASCII filename, error line, .java line, CR).
      # Mutation-tested: 6 mutations of parse.js, 6 killed.
      # The isGated call-graph walk decides 14 of the 34 warnings -- required legacy branch, or
      # real backlog. It was the last component with neither a corpus nor a theorem, and the
      # first corpus run found a REAL defect in the only branch that could absolve without
      # evidence: the SDK_INT window crossed function boundaries. Fixtures cover direct gate,
      # caller gate, mixed callers, no callers, property initialiser, cycle, depth exhaustion and
      # the anonymous-object indent case. Mutation-tested: 10 mutations, 10 killed.
      # unmute2.js strips the @Suppress annotations before the measuring compile, so it is the
      # ROOT of the chain: under-strip and the compiler reports fewer warnings, the classifier
      # classifies fewer, the ceiling compares fewer, and every gate below stays green on a wrong
      # number. Measured 2026-08-01: it matched only the exact literal @Suppress("DEPRECATION"),
      # Kotlin suppression names are case-insensitive, and six lowercase ones masked 45
      # deprecations -- 34 reported, 79 real. The corpus covers every spelling Kotlin accepts,
      # including @file: and multi-argument forms that do not exist in the tree today.
      - name: the suppression stripper must match its corpus
        if: matrix.flavor == 'arm64'
        run: node tools/deprecation/unmute-conformance.js

      - name: the gated/ungated classifier must match its corpus
        if: matrix.flavor == 'arm64'
        run: node tools/deprecation/gated-conformance.js

      - name: the deprecation parser must match its corpus
        if: matrix.flavor == 'arm64'
        run: node tools/deprecation/parse-conformance.js

      - name: the suppressed-deprecation backlog must not grow
        if: matrix.flavor == 'arm64'
        run: |
          set +e
          node tools/deprecation/unmute2.js strip > /dev/null
          strip_code=$?
          set -e
          if [ "$strip_code" -ne 0 ]; then
            echo "::error::unmute2.js strip failed ($strip_code) -- measurement did not happen"
            node tools/deprecation/unmute2.js restore > /dev/null 2>&1 || true
            exit 1
          fi
          set +e
          ./gradlew :libumdnscrypt:compileArm64DebugKotlin --rerun-tasks --console=plain > dep-ci.log 2>&1
          set -e
          # depgate itself fails if the log is empty -- a compile that did not run must never read
          # as a clean tree.
          set +e
          node tools/deprecation/depgate.js check dep-ci.log
          gate_code=$?
          set -e
          node tools/deprecation/unmute2.js restore
          if [ "$gate_code" -ne 0 ]; then
            echo "::error::new ungated deprecated API usage (depgate exit $gate_code). Gate it behind a version check or fix it; do not widen tools/deprecation/deprecation-baseline.json to make this pass."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          APK=$(find libumdnscrypt/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

      - uses: actions/upload-artifact@v6
        with:
          name: yeah-torta-${{ matrix.flavor }}-alpha
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # 4. PRE-RELEASE — tag-driven. Alpha means alpha; the flag says so.
  # ---------------------------------------------------------------------------------------------
  prerelease:
    name: publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect the APKs
        run: |
          mkdir -p release
          find artifacts -name '*.apk' -exec cp {} release/ \;
          ls -la release/
          test -n "$(ls -A release/)" || { echo "::error::no APKs to publish"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          prerelease: true
          generate_release_notes: true
          name: "Yeah! Tortä ${{ github.ref_name }} — ALPHA"
          body: |
            **This is a PRE-RELEASE (alpha).**

            Built end to end by GitHub Actions from source: the Rust engine, the Slint UI, the
            UniFFI bindings and both APKs. No binary in this repository was trusted to produce
            them.

            Gates that had to pass first — every one of these is a step in this workflow, and
            every one of them can fail the build:

            *Engine*
            - the Rust corpus must BE the shipped asset (checked before the tests, so a passing
              round-trip cannot be a round-trip over the wrong bytes)
            - engine unit tests (`cargo test --lib --features mirror,pure_rust,netstack` -- the SHIP recipe)
            - the suite must not silently shrink (a test-count floor, so deleting tests fails)
            - `rustfmt` must stay clean
            - zero warnings on all four shipped Android ABIs (`RUSTFLAGS=-D warnings cargo check --target ...`)
            - `clippy` must stay at zero on the shipped ABIs

            *Bindings and the .so*
            - UniFFI bindings match the current Rust surface (no stale generated Kotlin)
            - the built `.so` actually carries the pillar symbols (`mirror_status`,
              `centauri_serve_hits`, `resolver_doh_sinkhole_on`)
            - the A14 uniffi-record guard (wired into Gradle, and it throws if its script is missing)

            *Android*
            - JVM unit tests for the flavour
            - four self-check corpora for the deprecation tooling: the suppression stripper, the
              gated/ungated classifier, the parser, and a backlog ceiling that fails if the number
              of ungated deprecated usages grows

            NOT a gate, said plainly because an earlier version of this text claimed it was: the
            Slint goldens. This workflow RENDERS them on Linux and uploads them as an artifact,
            and the step is labelled "never authoritative" for a reason -- three `Text` elements
            carry no pinned font-family, so they rasterise with the host's default font and a
            Linux render cannot be compared against a device golden. `torta_ui` is BUILT here but
            its tests are not run; the only `cargo test` in this workflow is `torta_core`'s.

            See README.md for what is proven and — deliberately — what is not yet.
