# Shared cargo config for all four Torta crates (carbon_bridge, torta_core,
# torta_iconforge, torta_ui). Cargo discovers this via upward search from each
# crate dir, so Android SDK discovery no longer depends on shell env inheritance.
#
# Background: i-slint-backend-android-activity's build.rs (via the android-build
# crate, env_paths/mod.rs) resolves android.jar as:
#   ANDROID_JAR -> explicit platform -> ANDROID_PLATFORM/API_LEVEL/SDK_VERSION
#   -> lexicographic max of <sdk>/platforms/*. Pinning ANDROID_JAR directly
# short-circuits the whole chain deterministically (android-36 = stable; avoids
# the preview-style "android-37.0" dir winning the lexicographic .max()).

# All four crates share ONE target dir on D: (218GB free) — C: was choked to
# <1GB by 92GB of per-crate target/ dirs. Shared dir also dedupes the SLINT +
# winnow + uniffi dependency graph that torta_core/torta_ui/carbon_bridge/
# torta_iconforge would otherwise each compile and store separately.
[build]
target-dir = "D:/cargo-targets/torta"

[env]
ANDROID_HOME = "D:/android-sdk"
ANDROID_SDK_ROOT = "D:/android-sdk"
# android-37.0 = newest platform (Android 17): the dependency's glue shim is
# compiled against the latest API surface; d8 still floors bytecode at minSdk.
ANDROID_JAR = "D:/android-sdk/platforms/android-37.0/android.jar"
ANDROID_PLATFORM = "android-37.0"
ANDROID_D8_JAR = "D:/android-sdk/build-tools/36.0.0/lib/d8.jar"
ANDROID_BUILD_TOOLS_VERSION = "36.0.0"
ANDROID_NDK_HOME = "D:/android-sdk/ndk/23.1.7779620"
ANDROID_NDK_ROOT = "D:/android-sdk/ndk/23.1.7779620"
JAVA_HOME = "C:/Users/Saimono/scoop/apps/temurin17-jdk/current"

# cc-rs toolchain pins for C code inside third-party -sys crates (our own code
# is pure Rust x UniFFI x Kotlin x SLINT — no .java/.c of ours). API level 21
# matches minSdkVersion 21 in libumdnscrypt/build.gradle. Windows needs the .cmd
# wrappers; the extensionless siblings are POSIX shell scripts.
CC_aarch64_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android21-clang.cmd"
CXX_aarch64_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android21-clang++.cmd"
AR_aarch64_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
CC_armv7_linux_androideabi = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi21-clang.cmd"
CXX_armv7_linux_androideabi = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi21-clang++.cmd"
AR_armv7_linux_androideabi = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
CC_i686_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/i686-linux-android21-clang.cmd"
CXX_i686_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/i686-linux-android21-clang++.cmd"
AR_i686_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
CC_x86_64_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android21-clang.cmd"
CXX_x86_64_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android21-clang++.cmd"
AR_x86_64_linux_android = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"

# 16 KB page-size alignment on 64-bit ABIs: required for Android 15+/16/17
# devices with 16K pages; NDK r23 does not emit this by default.
[target.aarch64-linux-android]
linker = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android21-clang.cmd"
ar = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
linker = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi21-clang.cmd"
ar = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"

[target.i686-linux-android]
linker = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/i686-linux-android21-clang.cmd"
ar = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"

[target.x86_64-linux-android]
linker = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android21-clang.cmd"
ar = "D:/android-sdk/ndk/23.1.7779620/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
